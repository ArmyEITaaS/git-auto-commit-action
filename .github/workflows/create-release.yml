name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v7.1.0)'
        required: true
        default: 'v7.1.0'
      target_branch:
        description: 'Branch or SHA to tag'
        required: true
        default: 'master'
      release_notes:
        description: 'Release notes (markdown)'
        required: false
        default: |
          ## Added

          - Add skip_push input option (#401)

          ## Changes

          - docs: fix typo in README.md (#400)

          ## Dependency Updates

          - Bump actions/checkout from 5 to 6 (#399)
          - Bump bats from 1.12.0 to 1.13.0 (#398)

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ inputs.tag }}';
            const target = '${{ inputs.target_branch }}';
            const body = `${{ inputs.release_notes }}`;

            // Create the tag ref on the target branch/SHA
            const refResponse = await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: (await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: target,
              })).data.commit.sha,
            });
            console.log(`Created tag: ${refResponse.data.ref}`);

            // Create the release
            const releaseResponse = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: body,
              draft: false,
              prerelease: false,
            });
            console.log(`Created release: ${releaseResponse.data.html_url}`);
